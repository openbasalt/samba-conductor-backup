# Drop-in for conductor-helper.service, installed with conductor-backup:
# the backup account's password as a credential (read by the helper only),
# conductor-backup's state directory writable (spool, requests, policy),
# conductor's database readable for the state snapshot. The backup itself
# runs over loopback (server = 127.0.0.1), within IPAddressAllow=localhost.
[Service]
LoadCredential=backup-account:/etc/conductor-backup/credentials/backup-account
ReadWritePaths=-/var/lib/conductor-backup
