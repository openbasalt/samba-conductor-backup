# Continuous integration of conductor-backup: the quality gates, then the packages
# (.deb and .rpm for amd64/x86_64 and arm64/aarch64, cross-compiled with CGO
# off, and the noarch SELinux policy package built in a Fedora 44
# container) checked by Debian 13's lintian and Fedora 44's rpmlint. Actions are pinned by commit SHA. Release builds: release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs on main (for example after a change of the CI App or its
  # settings, when there is no new commit to push).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: conductor-backup
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conductor-backup/go.mod
          cache-dependency-path: conductor-backup/go.sum
      - name: Pinned gate tools
        # staticcheck v0.8.1 pins golang.org/x/tools v0.44, which cannot
        # read the export data version 5 written by Go 1.27.2; build it
        # against x/tools v0.51.0 until a staticcheck release carries it.
        run: |
          cd "$(mktemp -d)"
          go mod init gatetools
          go get honnef.co/go/tools/cmd/staticcheck@v0.8.1 golang.org/x/tools@v0.51.0
          go install honnef.co/go/tools/cmd/staticcheck
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: gofmt, vet, staticcheck, govulncheck, go test -race
        working-directory: conductor-backup
        run: make check

  package:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: conductor-backup
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conductor-backup/go.mod
          cache-dependency-path: conductor-backup/go.sum
      - name: Packages (deb and rpm, amd64 and arm64), SELinux policy, SBOMs
        working-directory: conductor-backup
        run: make package
      - name: lintian (Debian 13)
        working-directory: conductor-backup
        run: make lintian
      - name: rpmlint (Fedora 44)
        working-directory: conductor-backup
        run: make rpmlint
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conductor-backup-packages
          path: conductor-backup/dist/
          retention-days: 7
