# Installed by conductor-backup-selinux as
# /usr/lib/systemd/system/conductor-backup-drill.service.d/selinux.conf:
# restore drills run in their own unconfined domain (conductor_backup_drill_t)
# instead of conductor_backup_t, the domain of backups on a domain
# controller (see conductor_backup.te).
[Service]
SELinuxContext=system_u:system_r:conductor_backup_drill_t:s0
